# ──────────────────────────────────────────────────────────────────────────────
# release.yml — Build, publish to npm + GitHub Packages, and create a release.
#
# Trigger: push of a semver tag  →  git tag v1.2.3 && git push --tags
#
# npm authentication: Trusted Publisher (OIDC) — no NPM_TOKEN secret required.
#   Configure on npmjs.com: package → Settings → Publishing → Trusted Publishers
#   → Add GitHub Actions publisher (owner, repo, workflow: release.yml).
#   The id-token: write permission below provides the OIDC token automatically.
#
# GITHUB_TOKEN is provided automatically by GitHub Actions.
# ──────────────────────────────────────────────────────────────────────────────

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'   # pre-release tags: v1.0.0-beta.1

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      # Save dist/ for subsequent publish jobs
      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1

  publish-npm:
    name: Publish → npm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write   # OIDC token for npm Trusted Publishing + provenance

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Restore the compiled output from the build job
      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Setup Node.js (npm publish)
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # setup-node writes `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`
      # into .npmrc. Even resolved to an empty value that entry blocks the OIDC
      # exchange, so it is removed before publishing.
      - name: Remove the setup-node token entry
        run: |
          npm config delete //registry.npmjs.org/:_authToken --location=project
          if [ -f .npmrc ] && grep -q '_authToken' .npmrc; then
            echo "::error::.npmrc still contains an _authToken entry; OIDC publishing would fail."
            exit 1
          fi

      # Stamp the version from the tag (strips the leading "v")
      - name: Set package version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm pkg set version="$VERSION"

      - name: Publish to npm
        run: NODE_AUTH_TOKEN="" npm publish --access public --provenance

  publish-gpr:
    name: Publish → GitHub Packages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write   # publish to GitHub Packages

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # GitHub Packages (npm) requires a scoped package name (@owner/pkg)
      - name: Setup Node.js (GitHub Packages registry)
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'

      - name: Set package name + version for GitHub Packages
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm pkg set name="@circle-rd/mcp-central-agent"
          npm pkg set version="$VERSION"

      - name: Publish to GitHub Packages
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  github-release:
    name: Create GitHub Release
    needs: [publish-npm, publish-gpr]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write   # create the GitHub release

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history so we can diff the changelog
          persist-credentials: false

      # Extract changelog section for this version (optional but nice)
      - name: Extract release notes
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Try to grab the relevant section from CHANGELOG.md if it exists
          if [[ -f CHANGELOG.md ]]; then
            NOTES=$(awk "/^## \[?v?${VERSION}\]?/,/^## \[?v?[0-9]/" CHANGELOG.md \
                    | head -n -1 | tail -n +2)
          else
            NOTES="Release ${GITHUB_REF_NAME}"
          fi
          # Store multi-line output safely
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.notes }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
